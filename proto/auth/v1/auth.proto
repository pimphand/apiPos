syntax = "proto3";

package auth.v1;

option go_package = "apiPos/gen/auth/v1;authv1";

import "google/api/annotations.proto";

service AuthService {
  // Register creates a new user account
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }

  // Login authenticates a user and returns tokens
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  // RefreshToken refreshes an access token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  // Logout logs out a user
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string full_name = 4;
  // Browser/device identifier used to bind the issued refresh token.
  string device_id = 5;
  // Name of the store to create for the registering user (required for SaaS onboarding).
  // The store is created inactive/pending until verified by a superadmin, and the
  // registering user is assigned the admin role for it.
  string store_name = 6;
}

message RegisterResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
  User user = 4;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // Browser/device identifier used to bind the issued refresh token so a
  // token copied to another device cannot be used.
  string device_id = 3;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
  User user = 4;
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  string role_id = 5;
  string role_name = 6;
  string store_id = 7;
  bool is_active = 8;
  // Permission names granted to this user's role, returned on register/login so
  // the client can do permission-based UI without a separate /permissions/my
  // call (which would be visible in the browser's network tab).
  repeated string permissions = 9;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  // Device identifier the refresh token was originally bound to. A mismatch
  // (token pasted/used from another device) is rejected.
  string device_id = 2;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
  // Permission names granted to the refreshed user's role (same rationale as
  // User.permissions — avoids a separate permissions request on session restore).
  repeated string permissions = 4;
}

message LogoutRequest {
  string refresh_token = 1;
  // Optional device identifier; when present, only tokens for this device are
  // revoked, otherwise all tokens for the user are revoked.
  string device_id = 2;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}
