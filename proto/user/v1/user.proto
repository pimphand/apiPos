syntax = "proto3";

package user.v1;

option go_package = "apiPos/gen/user/v1;userv1";

import "google/api/annotations.proto";

service UserService {
  // CreateUser creates a new user
  rpc CreateUser(CreateUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "*"
    };
  }

  // GetUser gets a user by ID
  rpc GetUser(GetUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{id}"
    };
  }

  // ListUsers lists users with filters
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/users"
    };
  }

  // UpdateUser updates a user
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      put: "/api/v1/users/{id}"
      body: "*"
    };
  }

  // DeleteUser deletes a user
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/api/v1/users/{id}"
    };
  }

  // UpdateUserRole updates a user's role
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UserResponse) {
    option (google.api.http) = {
      patch: "/api/v1/users/{id}/role"
      body: "*"
    };
  }
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string full_name = 4;
  string role_id = 5;
  string store_id = 6;
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  string role_id = 1;
  // Filter by active status: "" = all, "true" = active only, "false" = inactive only
  string is_active = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message UpdateUserRequest {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string role_id = 4;
  string store_id = 5;
  bool is_active = 6;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

message UpdateUserRoleRequest {
  string id = 1;
  string role_id = 2;
}

message UserResponse {
  User user = 1;
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  string role_id = 5;
  string role_name = 6;
  string store_id = 7;
  bool is_active = 8;
  string created_at = 9;
  string updated_at = 10;
}

message Role {
  string id = 1;
  string name = 2;
  string description = 3;
}
