syntax = "proto3";

package user.v1;

option go_package = "apiPos/gen/user/v1;userv1";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UserResponse);
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string full_name = 4;
  int64 role_id = 5;
  int64 store_id = 6;
}

message GetUserRequest {
  int64 id = 1;
}

message ListUsersRequest {
  int64 role_id = 1;
  bool is_active = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total_count = 2;
}

message UpdateUserRequest {
  int64 id = 1;
  string email = 2;
  string full_name = 3;
  int64 role_id = 4;
  int64 store_id = 5;
  bool is_active = 6;
}

message DeleteUserRequest {
  int64 id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

message UpdateUserRoleRequest {
  int64 id = 1;
  int64 role_id = 2;
}

message UserResponse {
  User user = 1;
}

message User {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  int64 role_id = 5;
  string role_name = 6;
  int64 store_id = 7;
  bool is_active = 8;
  string created_at = 9;
  string updated_at = 10;
}

message Role {
  int64 id = 1;
  string name = 2;
  string description = 3;
}
