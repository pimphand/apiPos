syntax = "proto3";

package accounting.v1;

option go_package = "apiPos/gen/accounting/v1;accountingv1";

import "google/api/annotations.proto";

// AccountingService exposes the double-entry engine and the 7 financial
// statements. All money is carried as decimal strings (never double).
service AccountingService {
  // ---- Chart of accounts ----
  rpc CreateAccount(CreateAccountRequest) returns (AccountResponse) {
    option (google.api.http) = {post: "/api/v1/accounting/accounts" body: "*"};
  }
  rpc GetAccount(GetAccountRequest) returns (AccountResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/accounts/{id}"};
  }
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/accounts"};
  }
  rpc UpdateAccount(UpdateAccountRequest) returns (AccountResponse) {
    option (google.api.http) = {put: "/api/v1/accounting/accounts/{id}" body: "*"};
  }

  // ---- Journals ----
  rpc CreateManualJournal(CreateManualJournalRequest) returns (JournalResponse) {
    option (google.api.http) = {post: "/api/v1/accounting/journals" body: "*"};
  }
  rpc PostJournal(PostJournalRequest) returns (JournalResponse) {
    option (google.api.http) = {post: "/api/v1/accounting/journals/{id}/post"};
  }
  rpc ReverseJournal(ReverseJournalRequest) returns (JournalResponse) {
    option (google.api.http) = {post: "/api/v1/accounting/journals/{id}/reverse" body: "*"};
  }
  rpc ListJournals(ListJournalsRequest) returns (ListJournalsResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/journals"};
  }
  rpc GetJournal(GetJournalRequest) returns (JournalResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/journals/{id}"};
  }

  // ---- Periods ----
  rpc CreatePeriod(CreatePeriodRequest) returns (PeriodResponse) {
    option (google.api.http) = {post: "/api/v1/accounting/periods" body: "*"};
  }
  rpc ClosePeriod(ClosePeriodRequest) returns (PeriodResponse) {
    option (google.api.http) = {post: "/api/v1/accounting/periods/{id}/close"};
  }
  rpc ListPeriods(ListPeriodsRequest) returns (ListPeriodsResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/periods"};
  }

  // ---- Financial statements ----
  rpc GetTrialBalance(ReportRequest) returns (StatementResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/reports/trial-balance"};
  }
  rpc GetGeneralLedger(GeneralLedgerRequest) returns (GeneralLedgerResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/reports/general-ledger"};
  }
  rpc GetGeneralJournal(ListJournalsRequest) returns (ListJournalsResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/reports/general-journal"};
  }
  rpc GetIncomeStatement(ReportRequest) returns (StatementResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/reports/income-statement"};
  }
  rpc GetBalanceSheet(ReportRequest) returns (StatementResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/reports/balance-sheet"};
  }
  rpc GetChangesInEquity(ReportRequest) returns (StatementResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/reports/changes-in-equity"};
  }
  rpc GetCashFlow(ReportRequest) returns (StatementResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/reports/cash-flow"};
  }
  rpc ValidateBooks(ReportRequest) returns (ValidateResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/reports/validate"};
  }

  // ---- Export ----
  rpc ExportStatement(ExportRequest) returns (ExportResponse) {
    option (google.api.http) = {get: "/api/v1/accounting/export/{report}"};
  }
}

message CreateAccountRequest {
  string code = 1;
  string name = 2;
  string account_type = 3;
  string normal_balance = 4;
  string parent_id = 5;
  bool is_cash_equiv = 6;
  bool is_active = 7;
}
message GetAccountRequest { string id = 1; }
message ListAccountsRequest {
  string account_type = 1;
  string is_active = 2;  // "true" | "false" | "" (proto3 bool ambiguity)
  int32 page = 3;
  int32 per_page = 4;
}
message UpdateAccountRequest {
  string id = 1;
  string name = 2;
  string is_active = 3;
}
message AccountResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  string account_type = 4;
  string normal_balance = 5;
  string parent_id = 6;
  bool is_cash_equiv = 7;
  bool is_active = 8;
  string created_at = 9;
}
message ListAccountsResponse {
  repeated AccountResponse accounts = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message JournalLineRequest {
  string account_code = 1;
  string debit = 2;
  string credit = 3;
  string memo = 4;
}
message CreateManualJournalRequest {
  string entry_date = 1;
  string description = 2;
  repeated JournalLineRequest lines = 3;
}
message PostJournalRequest { string id = 1; }
message ReverseJournalRequest { string id = 1; string reason = 2; }
message ListJournalsRequest {
  string source_type = 1;
  string status = 2;
  string start_date = 3;
  string end_date = 4;
  int32 page = 5;
  int32 per_page = 6;
}
message GetJournalRequest { string id = 1; }
message JournalLineResponse {
  string id = 1;
  string account_id = 2;
  string account_code = 3;
  string account_name = 4;
  string debit = 5;
  string credit = 6;
  string memo = 7;
}
message JournalResponse {
  string id = 1;
  string entry_number = 2;
  string entry_date = 3;
  string entry_type = 4;
  string source_type = 5;
  string source_id = 6;
  string description = 7;
  string status = 8;
  string reversal_of_id = 9;
  string reversed_by_id = 10;
  string created_at = 11;
  repeated JournalLineResponse lines = 12;
}
message ListJournalsResponse {
  repeated JournalResponse journals = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message CreatePeriodRequest {
  string period_name = 1;
  string start_date = 2;
  string end_date = 3;
}
message ClosePeriodRequest { string id = 1; }
message ListPeriodsRequest {}
message PeriodResponse {
  string id = 1;
  string period_name = 2;
  string start_date = 3;
  string end_date = 4;
  string status = 5;
  string closed_at = 6;
}
message ListPeriodsResponse {
  repeated PeriodResponse periods = 1;
  int64 total_count = 2;
}

message ReportRequest {
  string start_date = 1;
  string end_date = 2;
  string store_id = 3;
}
message GeneralLedgerRequest {
  string account_id = 1;
  string start_date = 2;
  string end_date = 3;
  int32 page = 4;
  int32 per_page = 5;
}
message GeneralLedgerResponse {
  repeated LedgerLine lines = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 per_page = 4;
  string running_balance = 5;
}
message LedgerLine {
  string entry_date = 1;
  string entry_number = 2;
  string source_type = 3;
  string source_id = 4;
  string debit = 5;
  string credit = 6;
  string balance = 7;
  string memo = 8;
  string entry_id = 9;
}
message StatementLine {
  string account_code = 1;
  string account_name = 2;
  string account_type = 3;
  string debit = 4;
  string credit = 5;
  string balance = 6;
  string prior_balance = 7;
  string delta = 8;
  bool is_subtotal = 9;
  bool is_total = 10;
}
message ValidationWarning {
  string code = 1;
  string severity = 2;
  string message = 3;
  string account_code = 4;
  string expected = 5;
  string actual = 6;
}
message StatementResponse {
  string title = 1;
  string start_date = 2;
  string end_date = 3;
  repeated StatementLine lines = 4;
  string total_debit = 5;
  string total_credit = 6;
  string total_balance = 7;
  repeated ValidationWarning warnings = 8;
  string generated_at = 9;
}
message ValidateResponse {
  repeated ValidationWarning warnings = 1;
  string generated_at = 2;
}
message ExportRequest {
  string report = 1;
  string format = 2;
  string start_date = 3;
  string end_date = 4;
  string store_id = 5;
}
message ExportResponse {
  bytes file_bytes = 1;
  string filename = 2;
  string content_type = 3;
}
