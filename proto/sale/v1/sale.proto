syntax = "proto3";

package sale.v1;

option go_package = "apiPos/gen/sale/v1;salev1";

import "google/api/annotations.proto";

service SaleService {
  // CreateSale creates a new sale (checkout)
  rpc CreateSale(CreateSaleRequest) returns (SaleResponse) {
    option (google.api.http) = {
      post: "/api/v1/sales"
      body: "*"
    };
  }

  // GetSale gets a sale by ID with items
  rpc GetSale(GetSaleRequest) returns (SaleDetailResponse) {
    option (google.api.http) = {
      get: "/api/v1/sales/{id}"
    };
  }

  // GetSaleByInvoice gets a sale by invoice number
  rpc GetSaleByInvoice(GetSaleByInvoiceRequest) returns (SaleDetailResponse) {
    option (google.api.http) = {
      get: "/api/v1/sales/invoice/{invoice_number}"
    };
  }

  // ListSales lists sales with filters
  rpc ListSales(ListSalesRequest) returns (ListSalesResponse) {
    option (google.api.http) = {
      get: "/api/v1/sales"
    };
  }

  // CancelSale cancels a sale
  rpc CancelSale(CancelSaleRequest) returns (SaleResponse) {
    option (google.api.http) = {
      post: "/api/v1/sales/{id}/cancel"
      body: "*"
    };
  }

  // RefundSale refunds a sale
  rpc RefundSale(RefundSaleRequest) returns (SaleResponse) {
    option (google.api.http) = {
      post: "/api/v1/sales/{id}/refund"
      body: "*"
    };
  }
}

message CreateSaleRequest {
  string store_id = 1;
  string customer_id = 2;
  repeated SaleItemInput items = 3;
  double discount = 4;
  double tax_rate = 5;
  // Payment info
  string payment_method = 6;
  double amount_paid = 7;
  string payment_reference = 8;
  // Customer can be specified by name. When provided and no customer_id is
  // given, the system looks up an existing customer with the same name
  // (in the same store) and reuses it, or creates a new one.
  string customer_name = 9;
  // Optional order notes (e.g. kitchen instructions). Nullable.
  string notes = 10;
}

message SaleItemInput {
  string product_id = 1;
  string sku_id = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double discount = 5;
}

message GetSaleRequest {
  string id = 1;
}

message GetSaleByInvoiceRequest {
  string invoice_number = 1;
}

message ListSalesRequest {
  string store_id = 1;
  string cashier_id = 2;
  string customer_id = 3;
  string status = 4;
  string start_date = 5;
  string end_date = 6;
  int32 page = 7;
  int32 per_page = 8;
}

message ListSalesResponse {
  repeated Sale sales = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message CancelSaleRequest {
  string id = 1;
  string reason = 2;
}

message RefundSaleRequest {
  string id = 1;
  string reason = 2;
}

message SaleResponse {
  Sale sale = 1;
}

message SaleDetailResponse {
  Sale sale = 1;
  repeated SaleItem items = 2;
  repeated Payment payments = 3;
  double amount_paid = 4;
  double change = 5;
}

message Sale {
  string id = 1;
  string invoice_number = 2;
  string store_id = 3;
  string store_name = 4;
  string cashier_id = 5;
  string cashier_name = 6;
  string customer_id = 7;
  string customer_name = 8;
  double subtotal = 9;
  double discount = 10;
  double tax = 11;
  double grand_total = 12;
  string status = 13;
  int32 item_count = 14;
  string created_at = 15;
  string updated_at = 16;
  string notes = 17;
}

message SaleItem {
  string id = 1;
  string sale_id = 2;
  string product_id = 3;
  string product_name = 4;
  string sku_id = 5;
  string sku_code = 6;
  int32 quantity = 7;
  double unit_price = 8;
  double discount = 9;
  double subtotal = 10;
  string created_at = 11;
}

message Payment {
  string id = 1;
  string sale_id = 2;
  string payment_method = 3;
  double amount = 4;
  string reference = 5;
  string paid_at = 6;
}
