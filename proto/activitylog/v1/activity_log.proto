syntax = "proto3";

package activitylog.v1;

option go_package = "apiPos/gen/activitylog/v1;activitylogv1";

import "google/api/annotations.proto";

service ActivityLogService {
  // ListActivityLogs lists activity logs with filters
  rpc ListActivityLogs(ListActivityLogsRequest) returns (ListActivityLogsResponse) {
    option (google.api.http) = {
      get: "/api/v1/activity-logs"
    };
  }

  // GetActivityLog gets an activity log by ID
  rpc GetActivityLog(GetActivityLogRequest) returns (ActivityLogResponse) {
    option (google.api.http) = {
      get: "/api/v1/activity-logs/{id}"
    };
  }

  // GetActivityLogsByUser gets activity logs for a specific user
  rpc GetActivityLogsByUser(GetActivityLogsByUserRequest) returns (ListActivityLogsResponse) {
    option (google.api.http) = {
      get: "/api/v1/activity-logs/user/{user_id}"
    };
  }

  // GetActivityLogsByResource gets activity logs for a specific resource
  rpc GetActivityLogsByResource(GetActivityLogsByResourceRequest) returns (ListActivityLogsResponse) {
    option (google.api.http) = {
      get: "/api/v1/activity-logs/resource/{resource}"
    };
  }
}

message ListActivityLogsRequest {
  string user_id = 1;
  string action = 2;
  string resource = 3;
  string start_date = 4;
  string end_date = 5;
  int32 page = 6;
  int32 per_page = 7;
}

message ListActivityLogsResponse {
  repeated ActivityLog logs = 1;
  int64 total_count = 2;
}

message GetActivityLogRequest {
  string id = 1;
}

message GetActivityLogsByUserRequest {
  string user_id = 1;
  int32 page = 2;
  int32 per_page = 3;
}

message GetActivityLogsByResourceRequest {
  string resource = 1;
  string resource_id = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message ActivityLogResponse {
  ActivityLog log = 1;
}

message ActivityLog {
  string id = 1;
  string user_id = 2;
  string username = 3;
  string action = 4;
  string resource = 5;
  string resource_id = 6;
  string description = 7;
  string ip_address = 8;
  string user_agent = 9;
  string metadata = 10;
  string created_at = 11;
}
