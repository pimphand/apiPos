name: ci

# Unit tests only. This pipeline never deploys, never touches a server, and
# never publishes container images; it just runs the test suites.
#
#   backend  - Go tests (module root, binary ./cmd/server)
#   frontend - Vitest unit tests for the Astro + Vue app in ./fe
#
# internal/integration needs a real PostgreSQL (TEST_DATABASE_DSN); it is not
# configured here, so that test skips itself and the package still passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests (go and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pos_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # cmd/swagger cannot compile in a clean checkout: its //go:embed
      # swagger-ui/* matches no committed files. That is a pre-existing gap, so
      # the packages are named explicitly instead of using ./...
      - name: Unit and integration tests
        env:
          TEST_DATABASE_DSN: postgres://postgres:pos_ci_test@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -count=1 ./internal/... ./middleware/... ./pkg/... ./cmd/server/...

  frontend:
    name: frontend unit tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
