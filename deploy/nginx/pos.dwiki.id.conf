# Reverse proxy untuk https://pos.dwiki.id -> POS edge (container fe-app).
#
# Simpan sebagai /etc/nginx/sites-available/pos.dwiki.id.conf, lalu:
#   sudo ln -s /etc/nginx/sites-available/pos.dwiki.id.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d pos.dwiki.id        # sekali saja, untuk sertifikat
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prasyarat di sisi aplikasi (docker compose di server):
#   EDGE_PORT=8990        # HTTP edge, loopback (default)
#   EDGE_TLS_PORT=9443    # WAJIB diganti, karena 443 dipakai nginx ini
#   EDGE_BIND=127.0.0.1   # cukup loopback; domain masuk lewat nginx ini
# TLS untuk domain diterminasi di sini, jadi port TLS milik edge tidak diekspos
# ke domain (tetap loopback, tidak masalah kalau tidak dipakai).

# Upgrade header untuk WebSocket /ws.
# Kalau file ini di-include lebih dari sekali (banyak domain), pindahkan `map`
# ke /etc/nginx/conf.d/websocket-upgrade.conf agar tidak duplikat.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pos.dwiki.id;

    # Biarkan certbot mengakses /.well-known/acme-challenge/
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Bentuk `http2` sebagai parameter listen dipakai karena kompatibel dengan
    # nginx lama (< 1.25.1: tidak mengenal direktif `http2 on;`). Di nginx baru
    # hanya muncul peringatan deprecation, bukan error. Kalau server Anda
    # nginx >= 1.25.1 dan ingin bebas warning, ganti dua baris listen di bawah
    # menjadi `listen 443 ssl;` + `listen [::]:443 ssl;` lalu tambahkan
    # `http2 on;` satu baris setelahnya.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name pos.dwiki.id;

    ssl_certificate     /etc/letsencrypt/live/pos.dwiki.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.dwiki.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security headers ---------------------------------------------
    # Semua header lain (CSP, X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy, COOP, CORP) sudah dikirim oleh edge.
    # JANGAN diulang di sini: CSP yang terkirim dua kali akan di-intersect browser
    # dan bisa mematikan inline script/style milik aplikasi.
    #
    # HSTS hanya dikirim di sini karena di sinilah sertifikat valid (Let's Encrypt)
    # berada; edge bisa saja masih memakai self-signed dan browser akan mengabaikan
    # HSTS dari koneksi yang sertifikatnya tidak valid.
    # includeSubDomains hanya berlaku untuk *.pos.dwiki.id (aman: satu host ini).
    # `preload` sengaja belum dipakai — hanya tambahkan setelah yakin semua
    # subdomain memakai HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/pos.dwiki.id.access.log;
    error_log  /var/log/nginx/pos.dwiki.id.error.log;

    # Impor produk / upload bukti bayar (nginx default 1 MB).
    client_max_body_size 64m;

    # Realtime WebSocket — waktu tunggu panjang, tanpa buffering.
    location /ws {
        proxy_pass http://127.0.0.1:8990;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Semua path lain (/, /api/, /adminer/) diteruskan apa adanya ke edge.
    # Penting: proxy_pass TANPA trailing slash, supaya URI tidak dipotong.
    location / {
        proxy_pass http://127.0.0.1:8990;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Header keamanan tidak ditambahkan per-location: `add_header` di level server
    # otomatis diwarisi oleh semua location di atas (tidak ada location yang
    # mendefinisikan add_header sendiri), jadi API JSON, WebSocket 101, dan
    # halaman error nginx tetap mendapat HSTS tanpa mengubah body/status.
    #
    # Jangan tambahkan CSP/X-Frame-Options/dll di sini (duplikat dengan edge).
    # Jangan juga set X-Forwarded-Prefix; edge menimpanya untuk /adminer/.
}
