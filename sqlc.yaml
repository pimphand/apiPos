version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query/"
    schema: "db/migration/"
    gen:
      go:
        package: "db"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "int8"
            go_type: "int64"
          - db_type: "int4"
            go_type: "int32"
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "bool"
            go_type: "bool"
